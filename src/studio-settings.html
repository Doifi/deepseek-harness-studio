<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'">
  <title>Studio 更新</title>
  <link rel="stylesheet" href="./studio-settings.css">
</head>
<body>
  <main>
    <header class="hero">
      <span class="mark" aria-hidden="true">↻</span>
      <div>
        <p class="eyebrow">DEEPSEEK HARNESS STUDIO</p>
        <h1>应用更新</h1>
        <p>管理桌面壳的自动更新。Harness 的界面和插件能力保持官方原样。</p>
      </div>
    </header>

    <section class="versions" aria-label="版本信息">
      <div><span>桌面版</span><strong id="app-version">—</strong></div>
      <div><span>官方 Harness</span><strong id="harness-version">—</strong></div>
    </section>

    <section class="panel" aria-labelledby="update-heading">
      <div class="section-heading">
        <div>
          <p class="section-kicker">更新设置</p>
          <h2 id="update-heading">保持应用为最新版本</h2>
        </div>
        <label class="switch-row">
          <input type="checkbox" id="auto-check" checked>
          <span class="switch" aria-hidden="true"></span>
          <span>启动时检查</span>
        </label>
      </div>

      <div class="update-card">
        <span class="status-dot" id="status-dot" aria-hidden="true"></span>
        <div class="update-copy">
          <strong id="update-title">准备检查更新</strong>
          <p id="update-message">发现新版本后，由你决定是否下载和安装。</p>
        </div>
        <button class="button" id="update-action" type="button">立即检查</button>
      </div>
      <div class="progress" id="update-progress" hidden><span id="update-progress-bar"></span></div>
      <p class="privacy-note">更新只访问构建时配置的可信发布地址，不会上传会话、模型配置、API Key 或工作区内容。</p>
    </section>
  </main>

  <footer>DeepSeek Harness Studio · 非 DeepSeek 官方桌面客户端</footer>
  <script src="./studio-settings.js"></script>
</body>
</html>
