name: Build desktop installers

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            command: npm run dist:win
            artifact: windows-x64
            path: |
              release/*.exe
              release/*.exe.blockmap
              release/latest.yml
          - name: macOS Apple Silicon
            os: macos-15
            command: npm run dist:mac
            artifact: macos-arm64
            path: |
              release/*.dmg
              release/*.zip
              release/*.blockmap
              release/latest-mac.yml

    env:
      DSH_STUDIO_UPDATE_URL: https://github.com/${{ github.repository }}/releases/latest/download/

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install pnpm
        run: npm install --global pnpm@11.7.0

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile --registry=https://registry.npmjs.org

      - name: Run tests
        run: pnpm test

      - name: Build installer
        run: ${{ matrix.command }}

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: deepseek-harness-studio-${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    steps:
      - name: Download packaged releases
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release-assets/* --verify-tag --generate-notes --title "DeepSeek Harness Studio $GITHUB_REF_NAME"
